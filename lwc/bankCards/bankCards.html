<template>
    <!-- <lightning-card> -->   
        <div style="width:100%;margin:10px">
            <div style="width:90%; box-shadow: 2px 2px 5px rgb(122, 142, 148);border-radius:10px 10px 0px 0px">
                <div style="background-color:#a6a6a6; padding-top:5px; border-radius:5px">
                    <button class="accordion" onclick={handleAccordianClick}>
                        <div class="slds-grid" style="color:#15c0f1;">
                            <div class="slds-col slds-size_11-of-12 slds-grid slds-grid_align-spread" style="padding:8px 0px;">
                                <div class="slds-col">
                                    <div style="font-size:12px;color:#A6A6A6">
                                        DELINQUENT
                                    </div>
                                    <div style="font-size:20px;margin-top:2px;color:#212121">
                                        {creditCardDetails.Bank_Name__c}
                                    </div>
                                </div>
                                <div class="slds-col">
                                    <div style="font-size:12px;color:#A6A6A6;text-align:end">
                                        Enrolled Balance
                                    </div>
                                    <div style="font-size:20px;margin-top:2px;color:#212121;text-align:end">
                                        {creditCardDetails.Enrolled_Balance__c}
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-12 slds-grid slds-grid_align-end" style="font-size:30px">

        
                                <template if:true={cardIsOpen}>
                                    +
                                </template>
                                <template if:false={cardIsOpen}>
                                    &mdash;
                                </template>
                            </div>
                        </div>
                    </button>
                    <template if:false={cardIsOpen}>
                        <hr style="margin:0px">
                        <div style="background-color:white">
                            <div class="slds-wrap slds-p-around_large slds-grid slds-gutters">
                                <div class="slds-col slds-size_4-of-12">
                                    <label for="account-holder" style="float: left;">Account Holder</label>
                                    <select class="form-control ng-pristine ng-valid ng-touched" id="account-holder" name="account-holder">
                                        <option value="Primary">Primary</option>
                                        <option value="Secondary">Secondary</option>
                                        <option value="Joint">Joint</option>
                                    </select>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <label for="account-number" style="float: left;">Account Number</label>
                                    <input class="form-control ng-pristine ng-valid ng-touched" id="accNum" name="account-number" readonly type="text" value={creditCardDetails.Account_Number__c}>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <label for="DateOfLastPayment" style="float: left;">Date of Last Payment</label>
                                    <input class="form-control ng-pristine ng-valid ng-touched" id="LastPaymentDate" name="DateOfLastPayment" type="Date" readonly value={creditCardDetails.Date_of_Last_Payment__c}>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <label for="DateOfLastPayment" style="float: left;">Enrolled Balance</label>
                                    <!-- <input class="form-control ng-pristine ng-valid ng-touched" id="EnrolledBalance" name="DateOfLastPayment" type="number" min="0.01" step="0.01" max="2500" value={creditCardDetails.EnrolledBalance}> -->
                                    <input class="form-control ng-pristine ng-valid ng-touched" id="EnrolledBalance" name="EnrolledBalance" type="text" readonly value={creditCardDetails.Enrolled_Balance__c}>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <label for="DateOfLastPayment" style="float: left;">Balance</label>
                                    <!-- <input class="form-control ng-pristine ng-valid ng-touched" id="EnrolledBalance" name="DateOfLastPayment" type="number" min="0.01" step="0.01" max="2500" value={creditCardDetails.EnrolledBalance}> -->
                                    <input class="form-control ng-pristine ng-valid ng-touched" id="Balance" readonly name="Balance" type="text" value={creditCardDetails.Balance__c}>
                                </div>
                                <div class="slds-col slds-size_12-of-12">
                                    <label for="WhoIsLookingUp" style="float: left;">Who is contacting you about this debt?</label>
                                    <!-- <input class="form-control ng-pristine ng-valid ng-touched" id="EnrolledBalance" name="DateOfLastPayment" type="number" min="0.01" step="0.01" max="2500" value={creditCardDetails.EnrolledBalance}> -->
                                    <input class="form-control ng-pristine ng-valid ng-touched" readonly id="WhoIsLookingUp" name="WhoIsLookingUp" type="text" value={creditCardDetails.Question__c}>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
                
    <!-- </lightning-card> -->
</template>
