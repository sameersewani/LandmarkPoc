<template>
    <!-- For Desktop -->
    <div class="Desktop">
            <div style= "background: linear-gradient(60deg,#1562e6 0,#15c0f1 53%,#65e6d7 100%); height: 100vh;padding-top: 3%;">

                <div style="background: white; width: 30%; margin: auto; border-radius: 15px;">
                        <img src={bankLogo} style="margin: 2% 25%;width: 50%;margin-top: 1rem;">
                    <div style="margin-top: 2rem;">
                        <div class="slds-col" style="margin-left: 35px; order: -1;">
                            <p style="font-weight: 700;">{labels.Create_your_American_Debt_Relief_account}</p><br>

                            <lightning-input class="inputFields clientIDField" name="clientID" type="text" label="Client ID" value = {validClientId} placeholder="Enter your Client ID" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields emailField" name="email" type="email" label="Primary Email Address" value = {validEmailValue} placeholder="Enter your Primary Email Address" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields phoneField" name="phone" type="phone" label="Primary Phone Number (format: xxx-xxx-xxxx)" value = {validPhoneValue} placeholder="Enter your Primary Phone Number" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields usernameField" name="username" type="email" label="Username" value = {validUserName} placeholder="Enter your Username" onchange={changeHandler}>
                            </lightning-input>
                            <!-- <p style="font-weight: 400;">How would you like to receive your temporary password?</p> -->
                            <lightning-radio-group name="radioGroup"
                                                    label="How would you like to receive your temporary password?"
                                                    options={options}
                                                    value={value}
                                                    type="radio">
                            </lightning-radio-group>
                            <hr style="width: 88%;">
                            <button class="slds-button slds-button_brand createAccountButton" title="Primary action" style="width: 95%; display: grid; border-radius: 30px; background: #15c0f1; padding: 4px;" disabled={isDisableCreateAccount} onclick={saveCreateAccountData}><strong >CREATE ACCOUNT</strong></button><br>
                            <a onclick={returnToLoginButton} class="returnToLoginPage">Return to login page</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>




          <!-- For Mobile -->
    <div class="Mobile">
            <div  style= "background: linear-gradient(60deg,#1562e6 0,#15c0f1 53%,#65e6d7 100%); height: 100vh;padding-top: 5%;">

                <div class="whitediv" style="background: white; width: 85%; margin: auto; border-radius: 15px;">
                        <img src={bankLogo} style="margin: 2% 19%; width: 50%;">
                    <div style="margin-top: 2rem;">
                        <div class="slds-col" style="margin-left: 35px; order: -1;">
                            <p style="font-weight: 700;">{labels.Create_your_American_Debt_Relief_account}</p><br>

                            <lightning-input class="inputFields clientIDField" name="clientID" type="text" label="Client ID" value = {validClientId} placeholder="Enter your Client ID" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields emailField" name="email" type="email" label="Primary Email Address" value = {validEmailValue} placeholder="Enter your Primary Email Address" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields phoneField" name="phone" type="phone" label="Primary Phone Number (format: xxx-xxx-xxxx)" value = {validPhoneValue} placeholder="Enter your Primary Phone Number" onchange={changeHandler}>
                            </lightning-input>
                            <lightning-input class="inputFields usernameField" name="username" type="email" label="Username" value = {validUserName} placeholder="Enter your Username" onchange={changeHandler}>
                            </lightning-input>
                            <!-- <p style="font-weight: 400;">How would you like to receive your temporary password?</p> -->
                            <lightning-radio-group name="radioGroup"
                                                    label="How would you like to receive your temporary password?"
                                                    options={options}
                                                    value={value}
                                                    type="radio">
                            </lightning-radio-group>
                            <hr style="width: 88%;">
                            <button class="slds-button slds-button_brand createAccountButton" title="Primary action" style="width: 95%; display: grid; border-radius: 30px; background: #15c0f1; padding: 4px;" disabled={isDisableCreateAccount} onclick={saveCreateAccountData}><strong >CREATE ACCOUNT</strong></button>
                            <p onclick={returnToLoginButton} class="returnToLoginPage">Return to login page</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</template>
